# Fork-only: keep upstream releases adapted to allspark.
#
# Runs the same script a maintainer runs locally, but on a branch and behind a
# pull request. A green PR is the review gate; tag manually after merging.
# GitHub disables workflows on forks by default. Enable Actions in the fork's
# settings and configure the repository-scoped ALLSPARK_SYNC_TOKEN secret.

name: allspark upstream sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: allspark-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the sync token
        env:
          SYNC_TOKEN: ${{ secrets.ALLSPARK_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Configure the repository-scoped ALLSPARK_SYNC_TOKEN secret before running sync. See allspark/README.md."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ALLSPARK_SYNC_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Configure git
        run: |
          git config user.name "allspark sync"
          git config user.email "allspark-sync@users.noreply.github.com"
      - name: Resume an unmerged sync branch
        run: |
          git fetch origin --prune
          git merge --ff-only origin/main
          if git rev-parse --verify --quiet refs/remotes/origin/allspark/sync >/dev/null; then
            if git merge-base --is-ancestor origin/allspark/sync origin/main; then
              echo "The previous sync branch is already merged into main."
            else
              result=$?
              if [ "$result" -ne 1 ]; then
                exit "$result"
              fi
              git switch --track -c allspark/sync origin/allspark/sync
            fi
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              exit "$result"
            fi
            echo "No previous sync branch exists."
          fi
      - name: Show upstream position
        run: python3 allspark/sync.py status --fetch
      - name: Merge, validate, and push the sync branch
        run: python3 allspark/sync.py sync --apply --full --branch allspark/sync --push
      - name: Build the pull request summary
        run: |
          set -o pipefail
          if git show-ref --verify --quiet refs/heads/allspark/sync; then
            :
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              exit "$result"
            fi
            echo "upstream was already current" > "$RUNNER_TEMP/pr-body.md"
            exit 0
          fi
          {
            echo "Automated sync from morganlinton/BeautifulRust."
            echo
            echo "## Commits on the sync branch"
            echo
            echo '```'
            git log --oneline --no-decorate origin/main..allspark/sync
            echo '```'
            echo
            echo "## Files"
            echo
            echo '```'
            git diff --stat origin/main...allspark/sync
            echo '```'
            echo
            echo "## Skills"
            echo
            git diff --name-only origin/main...allspark/sync -- 'skills/*/SKILL.md' | sed 's/^/- /'
            echo
            echo "## Recorded upstream"
            echo
            echo '```json'
            cat allspark/upstream.json
            echo '```'
            echo
            echo "New upstream merges run the upstream validator, allspark compatibility checks, unit tests, examples, and lints before being pushed."
            echo
            echo "Merge with a merge commit, not squash, to preserve upstream history. Tag the merged commit after review; see allspark/README.md."
          } > "$RUNNER_TEMP/pr-body.md"
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.ALLSPARK_SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git show-ref --verify --quiet refs/heads/allspark/sync; then
            :
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              exit "$result"
            fi
            echo "no sync branch was created; upstream was already current"
            exit 0
          fi
          ahead=$(git rev-list --count origin/main..allspark/sync)
          if [ "$ahead" -eq 0 ]; then
            echo "sync branch has no commits ahead of main"
            exit 0
          fi
          number=$(gh pr list --state open --base main --head allspark/sync --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create \
              --base main \
              --head allspark/sync \
              --title "allspark: sync upstream" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi
      - name: Report a failed sync
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.ALLSPARK_SYNC_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="allspark sync failed"
          body="The scheduled allspark sync failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::warning::$body"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          if ! number=$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "allspark sync failed") | .number' --limit 100); then
            echo "::warning::Could not look up the sync failure issue. Check that Issues are enabled and the token has access."
            exit 0
          fi
          number=$(printf '%s\n' "$number" | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body" || echo "::warning::Could not comment on the sync failure issue. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --title "$title" --body "$body" || echo "::warning::Could not create a sync failure issue. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
